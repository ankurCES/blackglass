[project]
name = "blackglass-sidecar"
version = "0.1.0"
description = "Blackglass Python sidecar — scapy, impacket, pyflipper, gophish"
requires-python = ">=3.12"
dependencies = [
    "scapy>=2.5",
    "impacket>=0.11",
    "pyflipper>=0.5",
    "gophish>=0.3",
    "requests>=2.31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/blackglass_sidecar"]

[project.optional-dependencies]
# Dev deps for running the integration test. `uvicorn` is needed to
# boot the real secondary sidecar. `blackglass-secondary` is a sibling
# package under python/secondary-sidecar/ — install it with:
#   uv pip install -e python/secondary-sidecar
# before running the tests, or use the project's setup script.
dev = ["pytest>=8.0", "uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
